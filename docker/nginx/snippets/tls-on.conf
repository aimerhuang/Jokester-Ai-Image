# TLS_MODE=on：在本容器终止 HTTPS（证书挂载到 /etc/nginx/certs）。
# Cloudflare Full (strict) 下推荐使用 Cloudflare Origin Certificate。
listen 443 ssl;
http2 on;

ssl_certificate /etc/nginx/certs/tls.crt;
ssl_certificate_key /etc/nginx/certs/tls.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:jokester_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# HTTP 跳转 HTTPS；/healthz 保持 HTTP，供容器健康检查使用。
set $jokester_redirect_https $scheme;
if ($uri = /healthz) {
    set $jokester_redirect_https https;
}
if ($jokester_redirect_https = http) {
    return 301 https://$host$request_uri;
}
